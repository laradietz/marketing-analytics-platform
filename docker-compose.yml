services:
  postgres:
    image: postgres:16-alpine
    container_name: map-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-marketing_analytics}
      POSTGRES_USER: ${DB_USERNAME:-marketing_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-marketing_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-marketing_user} -d ${DB_NAME:-marketing_analytics}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: map-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-marketing_analytics}
      DB_USERNAME: ${DB_USERNAME:-marketing_user}
      DB_PASSWORD: ${DB_PASSWORD:-marketing_pass}
      JWT_SECRET: ${JWT_SECRET:-change-this-development-only-secret-key-please-32chars-min}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8081}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-demo@marketinganalytics.com}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-Demo1234!}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    container_name: map-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  postgres_data:
